# cwa-ingest-bridge — compose service for Dockge
#
# Run it on the machine where Calibre-Web-Automated runs, so it writes into
# the ingest folder directly. Put the secrets in the stack's .env.

services:
  cwa-ingest-bridge:
    image: ghcr.io/zchesler/cwa-ingest-bridge:latest
    container_name: cwa-ingest-bridge
    restart: unless-stopped
    # Owner of CWA's ingest folder (nobody:users on Unraid).
    user: "99:100"

    environment:
      CHAPTARR_URL: http://192.168.1.10:8789
      CHAPTARR_API_KEY: ${CHAPTARR_API_KEY}
      # Chaptarr's ebook root folder, as Chaptarr sees it.
      CHAPTARR_EBOOK_ROOT: /ebooks
      # Optional: hear about books that couldn't be copied.
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      TZ: Asia/Jerusalem

    volumes:
      # The same ebook folder, as this machine sees it (read-only is enough).
      - /mnt/remotes/NAS_media/books:/library:ro,slave
      # CWA's ingest folder.
      - /mnt/user/appdata/calibre-web-automated/ingest:/ingest
      # Remembers which imports were already copied.
      - /mnt/user/appdata/cwa-ingest-bridge:/state

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
